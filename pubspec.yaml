name: petcare_apk
description: "PetCare - Your Pet's Wellness Partner. A Flutter mobile app for managing pet health, schedules, and care."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3
  flutter_local_notifications: ^17.1.2
  image_picker: ^1.1.1
  table_calendar: ^3.1.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  timezone: ^0.9.4
  path_provider: ^2.1.3
  permission_handler: ^11.3.1
  flutter_timezone: ^5.1.0
  audioplayers: ^6.6.0
  google_generative_ai: ^0.4.7
  http: ^1.6.0
  html: ^0.15.6
  webview_flutter: ^4.13.1
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/dogs/
    - assets/images/cats/
    - assets/icons/
    - assets/fonts/
    - assets/audio/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"

